<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>8consulting 公開文書</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f8f6; --paper: #ffffff; --ink: #1d2320; --muted: #5d6762; --rule: #d9dfdb; --accent: #1f6f5c;
  --font-body: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121614; --paper: #1a201d; --ink: #e6ebe8; --muted: #a1aca6; --rule: #2e3833; --accent: #6cc3a8; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121614; --paper: #1a201d; --ink: #e6ebe8; --muted: #a1aca6; --rule: #2e3833; --accent: #6cc3a8; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.8; }
main { max-width: 40rem; margin: 0 auto; padding: 2.5rem max(16px, env(safe-area-inset-left, 0px)) 4rem; }
.brand { font-size: .85rem; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin: 0; }
h1 { font-size: 1.6rem; margin: .3rem 0 1.5rem; }
section { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 1.25rem 1.5rem; }
h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
ul { margin: 0; padding-left: 1.2rem; }
a { color: var(--accent); }
.muted { color: var(--muted); font-size: .9rem; }
footer { margin-top: 2rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <p class="brand">8consulting</p>
  <h1>公開文書 <span class="muted">／ Legal documents</span></h1>
  <section>
    <h2>アプリのプライバシーポリシー <span class="muted">／ App privacy policies</span></h2>
    <!-- 公開したアプリを 1 行ずつ足す：<li><a href="squeeze/ja/">アプリ名</a>（<a href="squeeze/en/">English</a>）</li> -->
    <p class="muted">準備中です。 ／ Coming soon.</p>
  </section>
  <footer>8consulting株式会社</footer>
</main>
</body>
</html>
